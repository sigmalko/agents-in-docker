services:
  agent:
    image: ${IMAGE:-ghcr.io/sigmalko/agents-in-docker:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-agents-in-docker}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      GH_TOKEN: ${GH_TOKEN:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      GHCR_USERNAME: ${GHCR_USERNAME:-sigmalko}
      AGENT_REPOSITORY: ${AGENT_REPOSITORY:-sigmalko/Cracow}
      GIT_USER_NAME: ${GIT_USER_NAME:-lingmine[bot]}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-188585048+sigmalko@users.noreply.github.com}
    ports:
      - "0.0.0.0:${SSH_PORT:-2222}:22"
      - "0.0.0.0:${SERVICE_PORT:-7777}:7777"
    volumes:
      - "${SSH_AUTHORIZED_KEYS:-./.ssh/authorized_keys}:/home/agent/.ssh/authorized_keys:ro"
      - agent-ssh-host-keys:/var/lib/ssh-host-keys
    init: true

volumes:
  agent-ssh-host-keys:
