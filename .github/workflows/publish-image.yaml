name: Build and publish agent image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - sshd_config
      - docker-entrypoint.sh
      - agent-shell.sh
      - .bash_profile
      - codex-alias.bashrc
      - ssh-colors.bashrc
      - cron/**
      - scripts/**
      - .github/workflows/publish-image.yaml

permissions:
  contents: read

concurrency:
  group: agents-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      on_main: ${{ steps.verify.outputs.on_main }}
    steps:
      - name: Check out source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit is on main
        id: verify
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF" == "refs/heads/main" ]]; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping image build because this tag does not point to a commit on main."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: verify-source
    if: needs.verify-source.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=build-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=agents-in-docker
            org.opencontainers.image.description=Run OpenAI Codex and Claude Code in a persistent Docker Compose container over SSH.
            org.opencontainers.image.url=https://github.com/sigmalko/agents-in-docker
            org.opencontainers.image.documentation=https://github.com/sigmalko/agents-in-docker#readme
            org.opencontainers.image.vendor=sigmalko

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
