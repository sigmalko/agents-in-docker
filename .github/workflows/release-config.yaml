name: Release Compose configuration

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      on_main: ${{ steps.verify.outputs.on_main }}
    steps:
      - name: Check out source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        id: verify
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping release because this tag does not point to a commit on main."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: verify-source
    if: needs.verify-source.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create release with Compose files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp .env.example "$RUNNER_TEMP/env.example"
          gh release create "$RELEASE_TAG" \
            docker-compose.yml \
            "$RUNNER_TEMP/env.example" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "$(cat .github/release-notes.md)" \
            --generate-notes
